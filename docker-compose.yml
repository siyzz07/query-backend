services:
  redis:
    image: redis:alpine
    container_name: query-redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: query-backend
    ports:
      - "7000:7000"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=7000
    restart: always

volumes:
  redis_data:

